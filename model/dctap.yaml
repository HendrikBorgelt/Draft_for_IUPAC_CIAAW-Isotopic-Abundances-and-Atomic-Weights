# Configuration for model_dctap.csv, read by dctap-python and by tap2model.py.
# See https://dctap-python.readthedocs.io/en/latest/config/
#
# The vocabulary and shape namespaces are placeholders until CIAAW chooses persistent IRIs.
# The terms of the ciaaw: vocabulary are defined in ontology.ttl.

prefixes:
  "ciaaw:": "https://hendrikborgelt.github.io/Draft_for_IUPAC_CIAAW-Isotopic-Abundances-and-Atomic-Weights/ciaaw-draft#"
  "dcterms:": "http://purl.org/dc/terms/"
  "owl:": "http://www.w3.org/2002/07/owl#"
  "prov:": "http://www.w3.org/ns/prov#"
  "rdf:": "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  "rdfs:": "http://www.w3.org/2000/01/rdf-schema#"
  "shape:": "https://hendrikborgelt.github.io/Draft_for_IUPAC_CIAAW-Isotopic-Abundances-and-Atomic-Weights/ciaaw-draft/shapes#"
  "skos:": "http://www.w3.org/2004/02/skos/core#"
  "units:": "https://si-digital-framework.org/SI/units/"
  "xsd:": "http://www.w3.org/2001/XMLSchema#"

# Columns added to the 12 standard DCTAP elements.
#   targetClass  shape: the class whose instances are validated against this shape.
#                Shapes without one are only reached through valueShape or extends.
#   extends      shape: another shape whose statements also apply (UML generalisation).
#   closed       shape: "true" when no other properties are allowed.
#   aspect       statement: which diagrams show this row. Space-separated keys from "aspects" below.
extra_shape_elements:
  - targetClass
  - extends
  - closed
extra_statement_template_elements:
  - aspect

# valueShape may list alternatives; a value has to match exactly one of them.
picklist_elements:
  - valueShape
picklist_item_separator: " "

# One UML diagram is generated per aspect, in this order.
# direction is the Mermaid layout: LR (left to right) or TB (top to bottom).
aspects:
  identity:
    direction: LR
    title: Elements and isotopes
    description: >-
      Elements and isotopes keep a stable IRI. They hold identifying facts and pointers,
      while every published value lives in a separate declaration.
  atomicWeight:
    direction: TB
    title: Atomic weight declarations
    description: >-
      The element points to all its standard atomic weight declarations and to the one that is current.
  abundance:
    direction: TB
    title: Isotopic abundance declarations
    description: >-
      The representative isotopic composition of one isotope: an interval, a value with an uncertainty,
      or a single value such as 1 for monoisotopic elements.
  atomicMass:
    direction: TB
    title: Atomic masses (planned)
    description: >-
      Part of the draft vocabulary, but not generated yet because the two source tables
      do not contain atomic masses.
  value:
    direction: LR
    title: Values
    description: >-
      A declaration holds its numbers itself, without a separate node: an interval, a value with its standard
      uncertainty, or a value alone, and always the value as CIAAW prints it, which keeps the significant figures.
  history:
    direction: LR
    title: History
    description: >-
      Declarations are never edited. A new value creates a new declaration with the status current; the old one
      becomes superseded, gets the year it ended, and the two are linked, as definitions are in the SI Reference Point.
  provenance:
    direction: LR
    title: Provenance
    description: >-
      Every element, isotope and declaration names the documents it was read from, and a declaration names the
      report in which CIAAW published it.
  footnote:
    direction: LR
    title: Footnotes
    description: >-
      The g, m and r notes printed below the CIAAW tables are shared resources that declarations refer to.
