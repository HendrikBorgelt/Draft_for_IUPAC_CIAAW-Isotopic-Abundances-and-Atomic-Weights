name: Build and publish the site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: make install PYTHON=python
      - run: make test PYTHON=python
      # The sparql-examples-utils jar is downloaded once per version and cached.
      - id: sparql-examples-utils
        run: echo "version=$(make -s print-sparql-examples-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: build/sparql-examples-utils-${{ steps.sparql-examples-utils.outputs.version }}-uber.jar
          key: sparql-examples-utils-${{ steps.sparql-examples-utils.outputs.version }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - run: make sparql-examples
      - name: The committed sparql-examples Turtle matches the queries
        run: git diff --exit-code -- sparql/examples
      - run: make site PYTHON=python
        env:
          SPARQL_ENDPOINT: ${{ vars.SPARQL_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Skipped until the SPARQL_ENDPOINT repository variable is set. See "The SPARQL endpoint" in README.md.
  # It runs after the site, because a new deployment is what makes the worker load the new data.
  deploy-sparql:
    if: vars.SPARQL_ENDPOINT != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: make sparql-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
